spring.application.name=literature-task
server.port=8080

# Europe PMC dependencies. Endpoints and behaviour verified live during API investigation;
# externalised here so tests can point at a local stub server.
europepmc.articles.base-url=https://www.ebi.ac.uk/europepmc/webservices/rest
europepmc.grist.base-url=https://www.ebi.ac.uk/europepmc/GristAPI/rest/get
europepmc.connect-timeout-ms=3000
europepmc.read-timeout-ms=8000
# Neither Europe PMC API publishes a documented rate limit; this bounds our own fan-out so a
# single request cannot open unbounded concurrent connections to an upstream dependency.
europepmc.grant-resolution-max-concurrency=8
# A single bounded retry for transient transport failures (connection reset, timeout) against
# either Europe PMC API -- not a full resilience framework, see RetrySupport for rationale.
# retry-attempts=2 means "try once, retry once" (1 initial attempt + 1 retry).
europepmc.retry-attempts=2
europepmc.retry-delay-ms=300
